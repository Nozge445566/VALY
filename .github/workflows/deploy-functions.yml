name: Deploy Edge Functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
permissions:
  contents: read
concurrency:
  group: deploy-functions
  cancel-in-progress: false
env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: xaacczkcmahoxbxwhwvx
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set."; exit 1; fi
          supabase functions deploy value-item connector-learn calibrate explain-item create-checkout customer-portal plan-prices --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
